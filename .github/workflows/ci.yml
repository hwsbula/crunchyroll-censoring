name: Extension checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check source and production build
        run: npm run check
      - name: Install browser and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Exercise the installed extension
        run: npm run test:e2e
      - name: Create extension and store submission packages
        run: |
          npm run package
          node scripts/package-store.mjs
      - name: Upload extension archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: extension-package
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
