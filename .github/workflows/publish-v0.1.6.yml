name: Publish verified v0.1.6

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v0.1.6.yml]

permissions:
  actions: read
  contents: write

concurrency:
  group: extension-release-v0.1.6
  cancel-in-progress: false

jobs:
  publish:
    # One-shot: only the immediate successor of the tested source can publish.
    # Subsequent normal pushes are skipped; remove this file after publication.
    if: github.repository == 'hwsbula/crunchyroll-censoring' && github.event.before == '1170b98fbb7eaaaf8f32fe0a4d735f6e3443acf1' && github.event.head_commit.message == 'Publish v0.1.6 from the verified production build'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: 1170b98fbb7eaaaf8f32fe0a4d735f6e3443acf1
    steps:
      - name: Verify the exact source passed CI
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh api "repos/$GH_REPO/actions/runs/43566867234" --jq '.head_sha + ":" + .conclusion')"
          [[ "$actual" == "$SOURCE_SHA:success" ]]
      - name: Retrieve the verified production archive
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: extension-package
          run-id: 43566867234
          github-token: ${{ github.token }}
          path: built
      - name: Prepare the installable ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          echo '6d800f31661584f7406e098826e36f4323021520f7a85fd4ea54dcf910221a21  built/crunchyroll-censoring-0.1.6.zip' | sha256sum --check
          mkdir assets
          cp built/crunchyroll-censoring-0.1.6.zip assets/crunchyroll-censoring-0.1.6-extension.zip
          (cd assets && sha256sum crunchyroll-censoring-0.1.6-extension.zip > crunchyroll-censoring-0.1.6-extension.zip.sha256)
          cat > notes.md <<'NOTES'
          Expanded the built-in catalogue to **1,161 literal terms and phrases** across swearing, insults/name-calling, sexual content, sexual anatomy, discriminatory slurs, and regional swearing/euphemisms. Added searchable categories, individual controls and Enable/Disable category buttons. Existing saved preferences and occurrence exceptions are retained.

          All categories start enabled, including mild insults and clinical anatomy. Some entries also have harmless meanings or can be names; disable unwanted entries in **Term settings**. Common variants are explicit, and additional spellings can be added as custom terms. See [term coverage and controls](https://github.com/hwsbula/crunchyroll-censoring/blob/v0.1.6/docs/TERMS.md).

          **Install/update:** download **crunchyroll-censoring-0.1.6-extension.zip** below and extract it. For an existing installation, replace the files in the same loaded folder, click **Reload** at `chrome://extensions`, then refresh Crunchyroll. For a new installation, enable Developer mode, choose **Load unpacked** and select the extracted folder containing `manifest.json`.

          The automatic Source code downloads require building. The SHA-256 sidecar verifies the installable ZIP. No permissions were added.

          Validation: 36 unit tests, 18 Chromium fixture scenarios and production checks passed for this exact source revision. Live-service compatibility remains subject to documented caption/rendering limits: English-audio filtering requires matching English-dub CC; Japanese audio remains unchanged; non-English subtitles remain untouched; whole-cue muting may silence surrounding dialogue. The vocabulary is broad but cannot cover every possible expression or spelling.
          NOTES
      - name: Create the exact tag and publish only after both uploads
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/git/ref/tags/v0.1.6" --jq '.object.sha' > tag-sha.txt 2> tag-error.txt; then
            [[ "$(cat tag-sha.txt)" == "$SOURCE_SHA" ]]
          else
            grep -Fq '(HTTP 404)' tag-error.txt || { cat tag-error.txt >&2; exit 1; }
            gh api "repos/$GH_REPO/git/refs" --method POST -f ref=refs/tags/v0.1.6 -f "sha=$SOURCE_SHA" >/dev/null
          fi
          gh release create v0.1.6 --verify-tag --draft --title 'CrunchyRoll Censoring v0.1.6' --notes-file notes.md
          gh release upload v0.1.6 assets/crunchyroll-censoring-0.1.6-extension.zip assets/crunchyroll-censoring-0.1.6-extension.zip.sha256
          gh release edit v0.1.6 --draft=false --latest
