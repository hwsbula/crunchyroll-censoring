<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CrunchyRoll Censoring synthetic player fixture</title>
    <style>
      body {
        font: 16px system-ui;
        margin: 24px;
        background: #e8e8e8;
      }
      #fixture-player {
        position: relative;
        width: 900px;
        height: 500px;
        background: #141b23;
        color: white;
      }
      video {
        width: 100%;
        height: 100%;
      }
      #fixture-caption {
        position: absolute;
        bottom: 50px;
        left: 10%;
        width: 80%;
        text-align: center;
        font: bold 27px sans-serif;
        white-space: pre-line;
        color: white;
        pointer-events: none;
      }
      button {
        margin: 4px;
        padding: 8px;
      }
    </style>
    <script src="/fixture-player.js" defer></script>
  </head>
  <body>
    <h1>Synthetic player fixture — not a live episode</h1>
    <p>Exercises only the inspected playback metadata and SubtitlesOctopus API contracts.</p>
    <button data-mode="english">English audio + CC</button
    ><button data-mode="japanese">Japanese audio + English subtitles</button
    ><button data-mode="missing">English audio without CC</button
    ><button data-mode="unknown">Unknown audio</button
    ><button data-mode="spanish">Spanish subtitles</button
    ><button data-mode="off">Subtitles initially off</button
    ><button data-mode="unsupported">Unsupported renderer</button><button id="play">Play</button
    ><button id="fullscreen">Fullscreen</button><button id="ad">Synthetic ad transition</button
    ><button id="off">Turn subtitles off</button>
    <button id="restore-subtitles">Restore English subtitles</button>
    <button id="managed-controls">Use stateful SDK controls</button>
    <label
      >Fixture timeline
      <input id="fixture-timeline" type="range" min="0" max="11.8" step="0.05" value="0"
    /></label>
    <p id="sdk-state">Native media controls</p>
    <p>SDK seeks: <span id="sdk-seeks">0</span></p>
    <p id="fixture-state">Choose a fixture</p>
    <div id="fixture-player">
      <video controls></video>
      <div id="fixture-caption"></div>
    </div>
  </body>
</html>
